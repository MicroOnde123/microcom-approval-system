{% load i18n static %}<!doctype html><html lang="{{ LANGUAGE_CODE|default:'en' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% trans "Print" %}</title><link rel="stylesheet" href="{% static 'css/document_print.css' %}"></head><body>
<nav class="print-tools" aria-label="{% trans 'Document actions' %}"><button type="button" data-print-pdf>{% trans "Print" %}</button><a data-download-pdf download="{{ filename }}">{% trans "Download PDF" %}</a><p role="status">{% trans "If the print dialog does not open, use Print or the PDF viewer's print control." %}</p></nav>
{{ pdf_base64|json_script:"private-pdf" }}<iframe title="{% trans 'Document preview' %}" data-pdf-frame></iframe><noscript>{% trans "JavaScript is required for this print preview. Return to the document to open its protected PDF." %}</noscript><script src="{% static 'js/document_print.js' %}" defer></script></body></html>
